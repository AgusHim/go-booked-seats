services:
  api:
    build: .
    ports:
      - "127.0.0.1:13000:3000"
    environment:
      DATABASE_URL: postgres://ticketing:usloop-loadtest-postgres@postgres:5432/ticketing?sslmode=disable
      REDIS_URL: redis:6379
      REDIS_PASSWORD: usloop-loadtest-redis
      JWT_SECRET: usloop-loadtest-jwt-secret-change-before-shared-use
      REQUIRE_JWT_SECRET: "true"
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - loadtest

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: usloop-loadtest-postgres
      POSTGRES_DB: ticketing
    volumes:
      - loadtest_postgres:/var/lib/postgresql/data
      - ../k6-test/mock_war_kursi_postgres.sql:/loadtest/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketing -d ticketing"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - loadtest

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "no"
      - --requirepass
      - usloop-loadtest-redis
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "usloop-loadtest-redis", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - loadtest

volumes:
  loadtest_postgres:

networks:
  loadtest:
